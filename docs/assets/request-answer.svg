<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 292" width="880" height="292" role="img" aria-labelledby="t d">
  <title id="t">A request to sys1rust and its answer</title>
  <desc id="d">Left: an app sends sys1rust a support message and three questions: which team should handle it (a choice of billing, tech or sales), how urgent it is (a score from none to now), and whether money is involved (a yes or no). Right: sys1rust answers billing with probability 0.79, urgency 2.54 on the 0 to 3 scale, and money involved with probability 0.73, in 13 ms of inference on a base M5, with the model on the GPU and no Python.</desc>
  <style>
    .win { fill: #161B22; stroke: #30363D; stroke-width: 1.5; }
    .bar { stroke: #30363D; stroke-width: 1; }
    .ttl { font: 500 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8B949E; }
    .cap { font: 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8B949E; }
    .m   { font: 13px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #E6EDF3; white-space: pre; }
    .dim { fill: #8B949E; }
    .pr  { fill: #E08A4B; }
    .ok  { fill: #3FB950; }
  </style>

  <!-- request -->
  <rect class="win" x="1" y="1" width="426" height="290" rx="10"/>
  <line class="bar" x1="1" y1="34" x2="427" y2="34"/>
  <circle cx="20" cy="17.5" r="5.5" fill="#FF5F57"/><circle cx="38" cy="17.5" r="5.5" fill="#FEBC2E"/><circle cx="56" cy="17.5" r="5.5" fill="#28C840"/>
  <text class="ttl" x="214" y="22" text-anchor="middle">your app asks</text>
  <text class="m" x="20" y="64" xml:space="preserve"><tspan class="pr">$</tspan> curl localhost:8000/v1/systemone -d '{</text>
  <text class="m" x="20" y="86" xml:space="preserve">  "state": "Customer: I was charged twice<tspan class="dim">…</tspan>",</text>
  <text class="m" x="20" y="108" xml:space="preserve">  "questions": {</text>
  <text class="m" x="20" y="130" xml:space="preserve">    "team": {"type": "choice", "criteria":</text>
  <text class="m" x="20" y="152" xml:space="preserve">      {"billing": <tspan class="dim">…</tspan>, "tech": <tspan class="dim">…</tspan>, "sales": <tspan class="dim">…</tspan>}},</text>
  <text class="m" x="20" y="174" xml:space="preserve">    "urgency": {"type": "score", "criteria":</text>
  <text class="m" x="20" y="196" xml:space="preserve">      ["none", "low", "high", "now"]},</text>
  <text class="m" x="20" y="218" xml:space="preserve">    "money": {"type": "noul"}}}'</text>
  <text class="cap" x="20" y="268">Trimmed. Each question also has its instructions.</text>

  <!-- answer -->
  <rect class="win" x="453" y="1" width="426" height="290" rx="10"/>
  <line class="bar" x1="453" y1="34" x2="879" y2="34"/>
  <circle cx="472" cy="17.5" r="5.5" fill="#FF5F57"/><circle cx="490" cy="17.5" r="5.5" fill="#FEBC2E"/><circle cx="508" cy="17.5" r="5.5" fill="#28C840"/>
  <text class="ttl" x="666" y="22" text-anchor="middle">sys1rust answers</text>
  <text class="m" x="472" y="64" xml:space="preserve">{"answers": {</text>
  <text class="m" x="472" y="86" xml:space="preserve">  "team": {"choice": <tspan class="pr">"billing"</tspan>,</text>
  <text class="m" x="472" y="108" xml:space="preserve">    "answer_confidence": <tspan class="pr">0.7941</tspan>},</text>
  <text class="m" x="472" y="130" xml:space="preserve">  "urgency": {"score": <tspan class="pr">2.5407</tspan>,</text>
  <text class="m" x="472" y="152" xml:space="preserve">    "legend": {"0": "none", <tspan class="dim">…</tspan>, "3": "now"}},</text>
  <text class="m" x="472" y="174" xml:space="preserve">  "money": {"noul": <tspan class="pr">0.7302</tspan>}}}</text>
  <text class="m" x="472" y="218" xml:space="preserve"><tspan class="ok">✓</tspan> 3 questions, 13 ms of inference</text>
  <text class="m dim" x="472" y="240" xml:space="preserve">  on a base M5, model on the GPU, no Python</text>
  <text class="cap" x="472" y="268">Trimmed. 13 ms is this request's inference time.</text>
</svg>
