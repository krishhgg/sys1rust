# On a v* tag, build both bundles, install them with install.sh and smoke-test them on macOS 15
# and 26 runners, then publish the GitHub release with SHA256SUMS. A vX.Y.Z-rcN tag publishes a
# prerelease. packaging/RELEASE.md is the checklist. A pull request that changes packaging/,
# install.sh or this file runs the build and smoke jobs only.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "install.sh"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Runs bash with -eo pipefail, so a failed command inside a pipe fails the step.
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Test install.sh
        # Fake bundles and a fake launchctl, so this needs no build, network or GPU.
        run: packaging/test_install.sh /bin/sh && packaging/test_install.sh /bin/dash
      - name: Check the tag against the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # build.sh reads the version with the same sed, which matches only the
          # [workspace.package] line. vX.Y.Z publishes that version and vX.Y.Z-rcN a prerelease of it.
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' runtime/Cargo.toml)
          re='^v([0-9]+\.[0-9]+\.[0-9]+)(-rc[0-9]+)?$'
          if ! [[ $GITHUB_REF_NAME =~ $re ]] || [ "${BASH_REMATCH[1]}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version. Tag v$version or v$version-rcN."
            exit 1
          fi
      - name: Install the pinned Rust
        run: |
          rust=$(cat packaging/rust-toolchain-version)
          rustup toolchain install "$rust" --profile minimal
          RUSTUP_TOOLCHAIN=$rust rustc --version
          {
            echo "RUSTUP_TOOLCHAIN=$rust"
            echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}"
          } >> "$GITHUB_ENV"
      - name: Cache the cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
          key: cargo-registry-${{ hashFiles('runtime/Cargo.lock') }}
          restore-keys: cargo-registry-
      - name: Build the macOS 26 bundle
        run: packaging/build.sh macos26 dist
      - name: Build the macOS 14 bundle
        run: packaging/build.sh macos14 dist
      - name: Checksums
        # The smoke jobs install through this file and the publish job uploads it.
        run: cd dist && shasum -a 256 sys1rust-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: bundles
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          # The tarballs are gzip files already.
          compression-level: 0

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 runs the macOS 14 bundle on an OS older than 26.2, the case that bundle exists for.
          - { runner: macos-15, flavor: macos14 }
          - { runner: macos-26, flavor: macos26 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      FLAVOR: ${{ matrix.flavor }}
      HF_HUB_CACHE: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bundles
          path: dist
      - name: Install with install.sh
        # install.sh checks the tarball against SHA256SUMS and links bin/sys1rust, so every step
        # below runs the binary through a symlink, as users do.
        run: |
          ./install.sh --from dist --prefix "$RUNNER_TEMP/sys1rust" --bin-dir "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Version and model list
        run: |
          sw_vers
          version=$(sys1rust --version)
          echo "$version"
          # install.sh picks the bundle from the macOS version, so check that it picked the one
          # this runner tests.
          if [[ $version != *", $FLAVOR build)" ]]; then
            echo "::error::install.sh installed '$version' on this runner, not the $FLAVOR bundle."
            exit 1
          fi
          sys1rust models
      - name: Cache the typed-decisions snapshot
        uses: actions/cache@v6
        with:
          path: .hf-cache
          # The typed-decisions revision in bench/models.lock.json, which sys1rust pins.
          key: hf-typed-decisions-1a793eb568e6718f15941d08f85432581df534e3
      - name: Pull typed-decisions
        run: sys1rust pull typed-decisions
      - name: Smoke test
        run: python3 packaging/smoke.py "$(command -v sys1rust)"
      - name: Uninstall with install.sh
        run: |
          ./install.sh --uninstall --prefix "$RUNNER_TEMP/sys1rust" --bin-dir "$RUNNER_TEMP/bin"
          if [ -e "$RUNNER_TEMP/sys1rust" ] || [ -L "$RUNNER_TEMP/bin/sys1rust" ]; then
            echo "::error::install.sh --uninstall left $RUNNER_TEMP/sys1rust or $RUNNER_TEMP/bin/sys1rust behind."
            exit 1
          fi

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    # gh finds the repository through GH_REPO, so this job needs no checkout.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bundles
          path: dist
      - name: Check the bundles against SHA256SUMS
        run: cd dist && sha256sum --check SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          # gh release create makes a draft, uploads the files and then publishes the draft, so a
          # cancelled attempt can leave a draft behind, and gh release create would add a second
          # one. The job stops on a draft of this tag and leaves it to a maintainer. Deleting it
          # here could remove a live release if someone publishes the draft in between.
          drafts=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$tag\") | .html_url" |
            paste -sd ' ' -)
          if [ -n "$drafts" ]; then
            echo "::error::Release $tag has a draft that an earlier attempt left: $drafts. Delete it on the Releases page (or \`gh release delete $tag\` after checking it is still a draft), then rerun the publish job."
            exit 1
          fi
          # This endpoint finds only a published release. A rerun goes on with it only if it has
          # both bundles and the SHA256SUMS of this run, so install.sh checks downloads against
          # the hashes of the bundles that the smoke jobs tested.
          if gh api "repos/$GH_REPO/releases/tags/$tag" --silent 2> /dev/null; then
            pub=$RUNNER_TEMP/published
            if ! gh release download "$tag" --dir "$pub" --pattern 'sys1rust-*.tar.gz' --pattern SHA256SUMS ||
              ! cmp -s dist/SHA256SUMS "$pub/SHA256SUMS" ||
              ! (cd "$pub" && sha256sum --quiet --check SHA256SUMS); then
              echo "::error::Release $tag is published with other files than this run built. Rerun only the failed jobs, or delete the release first."
              exit 1
            fi
            echo "Release $tag is published with these bundles and SHA256SUMS"
            exit 0
          fi
          flags=()
          case "$tag" in *-rc*) flags+=(--prerelease) ;; esac
          gh release create "$tag" dist/sys1rust-*.tar.gz dist/SHA256SUMS --verify-tag \
            --title "sys1rust ${tag#v}" --generate-notes "${flags[@]}"
