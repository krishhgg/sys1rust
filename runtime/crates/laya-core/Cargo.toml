[package]
name = "laya-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backend-independent Laya decision-engine runtime: tokenizer, sequence builder, decoding, weights."

[dependencies]
serde = { workspace = true }
# `arbitrary_precision`: a number keeps its literal, so an integer beyond u64 serializes with
# its digits as Python does, instead of as an f64 in scientific notation (see pyjson).
serde_json = { workspace = true, features = ["arbitrary_precision"] }
thiserror = { workspace = true }
tokenizers = { workspace = true }
safetensors = { workspace = true }
memmap2 = { workspace = true }
half = { workspace = true }
libm = { workspace = true }
